# Full stack: FastAPI service + Next.js dashboard.
#
#   docker compose up --build
#
# API  → http://localhost:8000  (docs at /docs)
# Web  → http://localhost:3000
#
# The API image trains all five models at build time, so the first build is slow
# (a few minutes) and needs no volumes.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: evcharging-api
    ports:
      - "8000:8000"
    environment:
      # allow the browser origin the dashboard is served from
      EVCHARGING_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # baked into the client bundle — must be reachable from the user's browser
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    image: evcharging-web
    ports:
      - "3000:3000"
    environment:
      # used by the dashboard's server-side data fetching, inside the compose network
      INTERNAL_API_BASE_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
